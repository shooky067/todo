<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘할일</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘할일">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#eef1f6; --card:#fff; --ink:#1b2333; --sub:#6a7488; --line:#dde2ec;
  --bar:#2f4de0; --barbg:#dfe4f2; --danger:#c0392b;
  --work:#2f4de0; --work-bg:#e6eaff;
  --personal:#c2610c; --personal-bg:#fdeedd;
  --study:#12805c; --study-bg:#dcf4ea;
  --c3:#b4235f; --c3b:#fbe3ee;
  --c4:#7a3fc2; --c4b:#eee3fb;
  --c5:#0a7e8c; --c5b:#d9f2f5;
  --c6:#5a6475; --c6b:#e6e9ef;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10141d; --card:#1a2030; --ink:#e8ecf5; --sub:#98a2b8; --line:#2b3347;
    --bar:#6f86ff; --barbg:#2b3347; --danger:#ff7b6b;
    --work:#8d9fff; --work-bg:#242c4d;
    --personal:#f0a35c; --personal-bg:#3b2c1c;
    --study:#4fd1a1; --study-bg:#173a2e;
    --c3:#ff8fb8; --c3b:#40202f;
    --c4:#c4a0ff; --c4b:#2f2347;
    --c5:#58d0de; --c5b:#173a40;
    --c6:#aab3c4; --c6b:#2b3347;
  }
}
[data-k=work]{--col:var(--work);--colbg:var(--work-bg)}
[data-k=personal]{--col:var(--personal);--colbg:var(--personal-bg)}
[data-k=study]{--col:var(--study);--colbg:var(--study-bg)}
[data-k=c3]{--col:var(--c3);--colbg:var(--c3b)}
[data-k=c4]{--col:var(--c4);--colbg:var(--c4b)}
[data-k=c5]{--col:var(--c5);--colbg:var(--c5b)}
[data-k=c6]{--col:var(--c6);--colbg:var(--c6b)}

*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.5;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(80px + env(safe-area-inset-bottom,0px));
}
.app{max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.date{color:var(--sub);font-size:14px}

.progress{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.big{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.big .pct{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.big .cnt{color:var(--sub);font-size:15px}
.bar{height:12px;background:var(--barbg);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--bar);border-radius:99px;transition:width .3s}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:12px 10px;margin-top:14px}
.cat .name{display:flex;justify-content:space-between;gap:6px;font-size:13px;margin-bottom:5px}
.cat .name b{font-weight:700;color:var(--col);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .name span{color:var(--sub);flex:none}
.cat .bar{height:6px}
.cat .bar>i{background:var(--col)}

.add{display:flex;gap:8px;margin:16px 0 12px}
input[type=text],select{
  font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px;
}
input[type=text]:focus,select:focus,button:focus-visible{outline:2px solid var(--bar);outline-offset:1px}
.add input{flex:1;min-width:0}
.add select{max-width:110px}
button{font:inherit;cursor:pointer;border-radius:10px;min-height:44px;border:1px solid transparent}
.primary{background:var(--bar);color:#fff;padding:0 18px;font-weight:700}
@media (prefers-color-scheme:dark){.primary{color:#10141d}}

.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--sub);padding:0 14px;min-height:40px;border-radius:99px}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tools{display:flex;gap:6px;margin-bottom:12px}
.tool{background:transparent;color:var(--sub);border:1px solid var(--line);min-height:36px;padding:0 12px;font-size:13px}
.tool[aria-pressed=true]{background:var(--bar);color:#fff;border-color:var(--bar);font-weight:700}
@media (prefers-color-scheme:dark){.tool[aria-pressed=true]{color:#10141d}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.panel h2{font-size:14px;margin:0 0 10px}
.panel .row{display:flex;gap:8px}
.panel .row input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:2px;padding:2px 2px 2px 12px;border-radius:99px;background:var(--colbg);color:var(--col);font-size:14px;font-weight:700}
.chip.fixed{padding-right:12px}
.chip button{background:transparent;color:inherit;min-height:32px;width:32px;padding:0}
.hint{color:var(--sub);font-size:12px;margin:8px 0 0}
.panel .actions{display:flex;gap:8px;flex-wrap:wrap}
.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:0 14px;font-weight:700}
.danger:disabled{opacity:.35;cursor:default}

ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;min-height:52px;
}
li input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--bar);cursor:pointer}
.txt{flex:1;min-width:0;word-break:break-word;cursor:text;padding:6px 0}
li.done .txt{text-decoration:line-through;color:var(--sub)}
li.done{opacity:.7}
.badge{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--colbg);color:var(--col);max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{flex:none;width:40px;min-height:40px;background:transparent;color:var(--sub);font-size:16px;padding:0}
.icon:hover:not(:disabled){background:var(--bg);color:var(--ink)}
.icon.del:hover{color:var(--danger)}
.icon:disabled{opacity:.25;cursor:default}
.handle{flex:none;width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:24px;font-weight:700;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:8px}
.handle:hover{background:var(--bg);color:var(--ink)}
.handle:active{cursor:grabbing}
.reorder li{user-select:none;-webkit-user-select:none}
li.dragging{position:relative;z-index:10;box-shadow:0 10px 28px rgba(0,0,0,.28);border-color:var(--bar);opacity:1;transition:none}
li.edit{padding:8px;flex-wrap:wrap}
li.edit input[type=text]{flex:1 1 100%}
li.edit select{flex:1}
.reorder li .txt{cursor:default}

.empty{display:block;text-align:center;color:var(--sub);padding:36px 12px}
.notice{background:var(--personal-bg);color:var(--personal);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;
  display:flex;align-items:center;gap:12px;font-size:14px;max-width:calc(100% - 32px);
}
.toast button{background:transparent;color:inherit;font-weight:700;text-decoration:underline;min-height:36px;padding:0 10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>오늘할일</h1>
    <span class="date" id="date"></span>
  </header>

  <div class="notice" id="notice" hidden>이 브라우저에서는 저장이 막혀 있어요. 창을 닫으면 할 일이 사라질 수 있어요.</div>

  <section class="progress" aria-label="진행률">
    <div class="big"><span class="pct" id="pct">0%</span><span class="cnt" id="cnt">0 / 0 완료</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><i></i></div>
    <div class="cats" id="cats"></div>
  </section>

  <div class="add">
    <input type="text" id="newText" placeholder="할 일을 입력하세요" maxlength="200" aria-label="새 할 일">
    <select id="newCat" aria-label="카테고리"></select>
    <button class="primary" id="addBtn">추가</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <button class="tool" id="catToggle" aria-pressed="false">⚙ 분류 관리</button>
    <button class="tool" id="orderToggle" aria-pressed="false">↕ 순서 변경</button>
    <button class="tool" id="bulkToggle" aria-pressed="false">🗑 일괄 삭제</button>
  </div>

  <section class="panel" id="bulkPanel" hidden>
    <h2 id="bulkTitle">일괄 삭제</h2>
    <div class="actions">
      <button class="danger" id="delDone"></button>
      <button class="danger" id="delAll"></button>
    </div>
    <p class="hint">현재 선택된 탭(전체 또는 분류)의 할 일만 삭제돼요. 삭제 직후 5초 안에는 실행 취소할 수 있어요.</p>
  </section>

  <p class="hint" id="orderHint" hidden style="margin:0 0 10px">≡ 를 잡고 위아래로 끌어서 순서를 바꿔요.</p>

  <section class="panel" id="catPanel" hidden>
    <h2>나만의 분류 추가</h2>
    <div class="row">
      <input type="text" id="catName" placeholder="예: 운동, 장보기" maxlength="10" aria-label="새 분류 이름">
      <button class="primary" id="catAdd">추가</button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="hint">분류는 최대 8개까지 만들 수 있어요. 기본 분류는 삭제할 수 없어요.</p>
  </section>

  <ul id="list"></ul>
</main>

<div class="toast" id="toast" hidden>
  <span id="toastMsg"></span>
  <button id="undoBtn">실행 취소</button>
</div>

<script>
(function () {
  var KEY = 'todo-app-v1';
  var CAT_KEY = 'todo-app-cats-v1';
  var MAX_CATS = 8;
  var DEFAULT_CATS = [
    { id: 'work', name: '업무', k: 'work', fixed: true },
    { id: 'personal', name: '개인', k: 'personal', fixed: true },
    { id: 'study', name: '공부', k: 'study', fixed: true }
  ];
  var EXTRA_COLORS = ['c3', 'c4', 'c5', 'c6'];

  var cats = DEFAULT_CATS.slice();
  var todos = [];
  var filter = 'all';
  var editingId = null;
  var reorderMode = false;
  var lastDeleted = null;
  var toastTimer = null;
  var storageOk = true;
  var focusH = null;
  var bulkOpen = false;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- storage ---------- */
  function load() {
    try {
      var rawC = localStorage.getItem(CAT_KEY);
      var c = rawC ? JSON.parse(rawC) : null;
      if (Array.isArray(c)) {
        var custom = c.filter(function (x) { return x && typeof x.id === 'string' && typeof x.name === 'string' && !x.fixed; })
          .map(function (x) { return { id: x.id, name: x.name, k: EXTRA_COLORS.indexOf(x.k) >= 0 ? x.k : 'c3' }; });
        cats = DEFAULT_CATS.concat(custom).slice(0, MAX_CATS);
      }
      var raw = localStorage.getItem(KEY);
      var data = raw ? JSON.parse(raw) : [];
      todos = Array.isArray(data) ? data.filter(function (t) { return t && typeof t.text === 'string'; }) : [];
      todos.forEach(function (t) { if (!getCat(t.category)) t.category = 'personal'; });
    } catch (e) {
      todos = [];
      storageOk = false;
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(todos));
      localStorage.setItem(CAT_KEY, JSON.stringify(cats));
    } catch (e) {
      storageOk = false;
      $('notice').hidden = false;
    }
  }

  function uid() { return Date.now().toString() + Math.random().toString(36).slice(2, 6); }
  function getCat(id) { return cats.filter(function (c) { return c.id === id; })[0]; }
  function pct(done, total) { return total ? Math.round(done / total * 100) : 0; }

  function el(tag, props, children) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), props[k]);
      else n.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }

  /* ---------- todo actions ---------- */
  function addTodo() {
    var input = $('newText');
    var text = input.value.trim();
    if (!text) { input.focus(); return; }
    todos.unshift({ id: uid(), text: text, category: $('newCat').value, done: false, createdAt: Date.now() });
    input.value = '';
    input.focus();
    save(); render();
  }

  function toggle(id) {
    todos.forEach(function (t) { if (t.id === id) t.done = !t.done; });
    save(); render();
  }

  function remove(id) {
    var i = todos.findIndex(function (t) { return t.id === id; });
    if (i < 0) return;
    lastDeleted = { list: [{ item: todos[i], index: i }] };
    todos.splice(i, 1);
    if (editingId === id) editingId = null;
    save(); render();
    showToast('할 일을 삭제했어요');
  }

  function undo() {
    if (!lastDeleted) return;
    lastDeleted.list.forEach(function (x) { todos.splice(Math.min(x.index, todos.length), 0, x.item); });
    lastDeleted = null;
    hideToast();
    save(); render();
  }

  function saveEdit(id, text, category) {
    text = text.trim();
    if (!text) return;
    todos.forEach(function (t) { if (t.id === id) { t.text = text; t.category = category; } });
    editingId = null;
    save(); render();
  }

  function scopeItems() {
    return todos.filter(function (t) { return filter === 'all' || t.category === filter; });
  }
  function scopeName() {
    var c = getCat(filter);
    return filter === 'all' || !c ? '전체' : c.name;
  }

  function bulkDelete(onlyDone) {
    var items = scopeItems().filter(function (t) { return !onlyDone || t.done; });
    if (!items.length) return;
    var where = filter === 'all' ? '' : "'" + scopeName() + "' 분류의 ";
    if (!confirm(where + (onlyDone ? '완료된 할 일 ' : '할 일 ') + items.length + '개를 삭제할까요?')) return;
    lastDeleted = { list: items.map(function (t) { return { item: t, index: todos.indexOf(t) }; }) };
    todos = todos.filter(function (t) { return items.indexOf(t) < 0; });
    editingId = null;
    save(); render();
    showToast(items.length + '개를 삭제했어요');
  }

  function getShown() {
    var s = todos.filter(function (t) { return filter === 'all' || t.category === filter; });
    return s.filter(function (t) { return !t.done; }).concat(s.filter(function (t) { return t.done; }));
  }

  function move(id, dir) {
    var s = getShown();
    var i = s.findIndex(function (t) { return t.id === id; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= s.length || s[j].done !== s[i].done) return;
    var a = todos.indexOf(s[i]), b = todos.indexOf(s[j]);
    var tmp = todos[a]; todos[a] = todos[b]; todos[b] = tmp;
    focusH = id;
    save(); render();
  }

  /* ---------- category actions ---------- */
  function addCat() {
    var input = $('catName');
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    if (cats.length >= MAX_CATS) { alert('분류는 최대 ' + MAX_CATS + '개까지 만들 수 있어요.'); return; }
    var dup = cats.some(function (c) { return c.name.toLowerCase() === name.toLowerCase(); });
    if (dup) { alert('이미 있는 분류 이름이에요.'); return; }
    var customCount = cats.length - DEFAULT_CATS.length;
    cats.push({ id: 'c' + uid(), name: name, k: EXTRA_COLORS[customCount % EXTRA_COLORS.length] });
    input.value = '';
    save(); render();
  }

  function removeCat(id) {
    var c = getCat(id);
    if (!c || c.fixed) return;
    var n = todos.filter(function (t) { return t.category === id; }).length;
    var msg = "'" + c.name + "' 분류를 삭제할까요?" + (n ? "\n이 분류의 할 일 " + n + "개는 '개인'으로 옮겨져요." : '');
    if (!confirm(msg)) return;
    todos.forEach(function (t) { if (t.category === id) t.category = 'personal'; });
    cats = cats.filter(function (x) { return x.id !== id; });
    if (filter === id) filter = 'all';
    save(); render();
  }

  /* ---------- toast ---------- */
  function showToast(msg) {
    $('toastMsg').textContent = msg;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() { $('toast').hidden = true; clearTimeout(toastTimer); }

  /* ---------- render ---------- */
  function fillSelect(sel, value) {
    sel.textContent = '';
    cats.forEach(function (c) {
      var o = el('option', { value: c.id, text: c.name });
      if (c.id === value) o.selected = true;
      sel.appendChild(o);
    });
  }

  function renderProgress() {
    var total = todos.length;
    var done = todos.filter(function (t) { return t.done; }).length;
    var p = pct(done, total);
    $('pct').textContent = p + '%';
    $('cnt').textContent = done + ' / ' + total + ' 완료';
    $('bar').setAttribute('aria-valuenow', p);
    $('bar').firstChild.style.width = p + '%';

    var box = $('cats');
    box.textContent = '';
    cats.forEach(function (c) {
      var list = todos.filter(function (t) { return t.category === c.id; });
      var d = list.filter(function (t) { return t.done; }).length;
      var bar = el('div', { class: 'bar' }, [el('i')]);
      bar.firstChild.style.width = pct(d, list.length) + '%';
      box.appendChild(el('div', { class: 'cat', 'data-k': c.k }, [
        el('div', { class: 'name' }, [el('b', { text: c.name }), el('span', { text: d + '/' + list.length })]),
        bar
      ]));
    });
  }

  function renderTabs() {
    var tabs = $('tabs');
    tabs.textContent = '';
    [{ id: 'all', name: '전체' }].concat(cats).forEach(function (c) {
      tabs.appendChild(el('button', {
        class: 'tab', text: c.name, 'aria-pressed': String(filter === c.id),
        onclick: function () { filter = c.id; render(); }
      }));
    });
  }

  function renderChips() {
    var box = $('chips');
    box.textContent = '';
    cats.forEach(function (c) {
      var chip = el('span', { class: 'chip' + (c.fixed ? ' fixed' : ''), 'data-k': c.k }, [document.createTextNode(c.name)]);
      if (!c.fixed) {
        chip.appendChild(el('button', { text: '✕', 'aria-label': c.name + ' 분류 삭제', onclick: function () { removeCat(c.id); } }));
      }
      box.appendChild(chip);
    });
  }

  function commitOrder(ids) {
    var shownSet = getShown();
    [false, true].forEach(function (d) {
      var slots = [];
      todos.forEach(function (t, i) { if (shownSet.indexOf(t) >= 0 && t.done === d) slots.push(i); });
      var items = ids.map(function (id) { return todos.filter(function (t) { return t.id === id; })[0]; })
        .filter(function (t) { return t && t.done === d; });
      if (items.length !== slots.length) return;
      slots.forEach(function (s, k) { todos[s] = items[k]; });
    });
    save(); render();
  }

  function startDrag(e, li) {
    if (e.button > 0) return;
    e.preventDefault();
    var handle = e.currentTarget;
    var ul = li.parentNode;
    var startY = e.clientY;
    li.classList.add('dragging');
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}

    function sib(next) {
      var s = next ? li.nextElementSibling : li.previousElementSibling;
      return s && s.getAttribute('data-done') === li.getAttribute('data-done') ? s : null;
    }
    function center(n) { var r = n.getBoundingClientRect(); return r.top + r.height / 2; }
    function swap(op, y) {
      var before = li.getBoundingClientRect().top;
      op();
      li.style.transform = 'none';
      var dy = before - li.getBoundingClientRect().top;
      li.style.transform = 'translateY(' + dy + 'px)';
      startY = y - dy;
    }
    function onMove(ev) {
      li.style.transform = 'translateY(' + (ev.clientY - startY) + 'px)';
      var p = sib(false), n = sib(true);
      if (p && center(li) < center(p)) swap(function () { ul.insertBefore(li, p); }, ev.clientY);
      else if (n && center(li) > center(n)) swap(function () { ul.insertBefore(li, n.nextSibling); }, ev.clientY);
    }
    function end() {
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', end);
      handle.removeEventListener('pointercancel', end);
      li.classList.remove('dragging');
      li.style.transform = '';
      var ids = [].map.call(ul.querySelectorAll('li[data-id]'), function (x) { return x.getAttribute('data-id'); });
      commitOrder(ids);
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }

  function renderItem(t, idx, shown) {
    var c = getCat(t.category) || cats[0];

    if (t.id === editingId) {
      var input = el('input', { type: 'text', value: t.text, maxlength: '200', 'aria-label': '할 일 수정', id: 'editInput' });
      var sel = el('select', { 'aria-label': '카테고리 수정' });
      fillSelect(sel, t.category);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') saveEdit(t.id, input.value, sel.value);
        if (e.key === 'Escape') { editingId = null; render(); }
      });
      return el('li', { class: 'edit' }, [
        input, sel,
        el('button', { class: 'icon', text: '✓', 'aria-label': '저장', title: '저장', onclick: function () { saveEdit(t.id, input.value, sel.value); } }),
        el('button', { class: 'icon', text: '✕', 'aria-label': '취소', title: '취소', onclick: function () { editingId = null; render(); } })
      ]);
    }

    var cb = el('input', { type: 'checkbox', 'aria-label': '완료', onchange: function () { toggle(t.id); } });
    cb.checked = t.done;
    var txt = el('span', { class: 'txt', text: t.text });
    var kids = [cb, txt, el('span', { class: 'badge', text: c.name })];

    if (reorderMode) {
      var handle = el('span', { class: 'handle', role: 'button', tabindex: '0', text: '≡', 'data-h': t.id,
        'aria-label': '끌어서 순서 변경 (키보드는 위/아래 방향키)' });
      handle.addEventListener('pointerdown', function (e) { startDrag(e, handle.parentNode); });
      handle.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowUp') { e.preventDefault(); move(t.id, -1); }
        if (e.key === 'ArrowDown') { e.preventDefault(); move(t.id, 1); }
      });
      kids.push(handle);
    } else {
      txt.title = '더블클릭하여 수정';
      txt.addEventListener('dblclick', function () { editingId = t.id; render(); });
      kids.push(
        el('button', { class: 'icon', text: '✎', 'aria-label': '수정', title: '수정', onclick: function () { editingId = t.id; render(); } }),
        el('button', { class: 'icon del', text: '✕', 'aria-label': '삭제', title: '삭제', onclick: function () { remove(t.id); } })
      );
    }
    return el('li', { class: t.done ? 'done' : '', 'data-k': c.k, 'data-id': t.id, 'data-done': String(t.done) }, kids);
  }

  function renderList() {
    var ul = $('list');
    ul.textContent = '';
    ul.className = reorderMode ? 'reorder' : '';
    var shown = getShown();
    if (!shown.length) {
      var msg = todos.length ? '이 분류에는 할 일이 없어요.' : '아직 할 일이 없어요. 첫 할 일을 추가해보세요.';
      ul.appendChild(el('li', { class: 'empty', text: msg }));
      return;
    }
    shown.forEach(function (t, i) { ul.appendChild(renderItem(t, i, shown)); });
  }

  function render() {
    renderProgress();
    renderTabs();
    renderChips();
    fillSelect($('newCat'), getCat($('newCat').value) ? $('newCat').value : cats[0].id);
    $('catPanel').hidden = $('catToggle').getAttribute('aria-pressed') !== 'true';
    $('orderToggle').setAttribute('aria-pressed', String(reorderMode));
    var sc = scopeItems();
    var nd = sc.filter(function (t) { return t.done; }).length;
    $('bulkPanel').hidden = !bulkOpen;
    $('bulkToggle').setAttribute('aria-pressed', String(bulkOpen));
    $('bulkTitle').textContent = '일괄 삭제 · 현재 보기: ' + scopeName();
    $('delDone').textContent = '완료된 할 일 삭제 (' + nd + ')';
    $('delDone').disabled = !nd;
    $('delAll').textContent = scopeName() + ' 할 일 모두 삭제 (' + sc.length + ')';
    $('delAll').disabled = !sc.length;
    $('orderHint').hidden = !reorderMode;
    renderList();

    var ei = $('editInput');
    if (ei) { ei.focus(); ei.setSelectionRange(ei.value.length, ei.value.length); }
    if (focusH) {
      var hb = document.querySelector('[data-h="' + focusH + '"]');
      if (hb) hb.focus();
      focusH = null;
    }
  }

  /* ---------- init ---------- */
  $('date').textContent = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
  $('addBtn').addEventListener('click', addTodo);
  $('newText').addEventListener('keydown', function (e) { if (e.key === 'Enter') addTodo(); });
  $('catAdd').addEventListener('click', addCat);
  $('catName').addEventListener('keydown', function (e) { if (e.key === 'Enter') addCat(); });
  $('undoBtn').addEventListener('click', undo);
  $('catToggle').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', String(on));
    render();
  });
  $('orderToggle').addEventListener('click', function () {
    reorderMode = !reorderMode;
    editingId = null;
    render();
  });

  $('bulkToggle').addEventListener('click', function () { bulkOpen = !bulkOpen; render(); });
  $('delDone').addEventListener('click', function () { bulkDelete(true); });
  $('delAll').addEventListener('click', function () { bulkDelete(false); });

  load();
  $('notice').hidden = storageOk;
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
